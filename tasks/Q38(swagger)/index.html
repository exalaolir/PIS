<!DOCTYPE html>
<html>
<head>
    <title>API Documentation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .endpoint {
            background: #ecf0f1;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .method {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 10px;
        }
        .get { background: #61affe; color: white; }
        .path { font-family: monospace; font-size: 16px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>API Documentation</h1>
        <p>Swagger UI available at <a href="/swagger/index.html" style="color: #ffd700;">/swagger/index.html</a></p>
    </div>

    <h2>Available Endpoints</h2>
    <div class="endpoint">
        <span class="method get">GET</span>
        <span class="path">/api/v1/pets/{id}</span>
        <span> - Get a pet by ID</span>
    </div>

    <hr>

    <h2>Swagger UI</h2>
    <iframe src="/swagger/index.html" width="100%" height="600" style="border: 1px solid #ddd;"></iframe>
</body>
</html>
